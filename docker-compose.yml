version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - FLASK_DEBUG=false
      - DEMO_MODE=true
      - CONFIDENCE_THRESHOLD=0.85
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATABASE_URL=postgresql://cropguard:${POSTGRES_PASSWORD:-cropguard}@db/cropguard
    volumes:
      - uploads_data:/app/uploads
      - model_data:/app/models
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=cropguard
      - POSTGRES_USER=cropguard
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cropguard}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cropguard"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  uploads_data:
  model_data:
  pg_data:
